<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#001f54" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.9; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    .pulsing-node {
      animation: pulse 3s infinite ease-in-out;
      transform-origin: center;
    }
    .floating-header {
      animation: float 4s infinite ease-in-out;
    }
    .ecg-line {
      stroke-dasharray: 20 10;
      animation: dash 5s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.1">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250 M 0 300 L 1200 300 M 0 350 L 1200 350" stroke="#ffffff" stroke-width="1" />
    <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400 M 600 0 L 600 400 M 700 0 L 700 400 M 800 0 L 800 400 M 900 0 L 900 400 M 1000 0 L 1000 400 M 1100 0 L 1100 400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Dynamic ECG / Clinical Activity Wave -->
  <path class="ecg-line" d="M 50 320 Q 200 320, 300 320 T 450 320 L 470 280 L 490 350 L 510 240 L 530 330 L 550 320 T 800 320 T 1150 320" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" opacity="0.8" />

  <!-- Floating Glowing Nodes -->
  <circle class="pulsing-node" cx="150" cy="100" r="40" fill="#00f2fe" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="100" r="8" fill="#00f2fe" />

  <circle class="pulsing-node" cx="1050" cy="120" r="50" fill="#ff0844" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="120" r="10" fill="#ff0844" />

  <circle class="pulsing-node" cx="950" cy="280" r="35" fill="#4facfe" opacity="0.2" filter="url(#glow)" />
  <circle cx="950" cy="280" r="6" fill="#4facfe" />

  <!-- Main Content Group -->
  <g class="floating-header" transform="translate(600, 170)">
    <!-- Icon / Badge -->
    <text x="0" y="-70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" text-anchor="middle" fill="#00f2fe">🏥 🧬 💻</text>
    
    <!-- Title -->
    <text x="0" y="-15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="url(#text-grad)" filter="url(#glow)">Awesome Site Management Organization Software</text>
    
    <!-- Subtitle -->
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#e0e1dd">Curated SaaS &amp; Open-Source Clinical Trial Site Ecosystem</text>
    
    <!-- Tags/Badges -->
    <g transform="translate(0, 75)">
      <!-- CTMS Tag -->
      <rect x="-310" y="-18" width="90" height="32" rx="16" fill="#1282a2" opacity="0.8" />
      <text x="-265" y="3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CTMS</text>
      
      <!-- eISF Tag -->
      <rect x="-200" y="-18" width="90" height="32" rx="16" fill="#00a896" opacity="0.8" />
      <text x="-155" y="3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">eISF</text>
      
      <!-- EDC Tag -->
      <rect x="-90" y="-18" width="80" height="32" rx="16" fill="#028090" opacity="0.8" />
      <text x="-50" y="3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">EDC</text>

      <!-- Site Operations -->
      <rect x="10" y="-18" width="130" height="32" rx="16" fill="#f77f00" opacity="0.8" />
      <text x="75" y="3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Site Operations</text>

      <!-- Recruitment -->
      <rect x="150" y="-18" width="160" height="32" rx="16" fill="#d62828" opacity="0.8" />
      <text x="230" y="3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Patient Recruitment</text>
    </g>
  </g>
</svg>